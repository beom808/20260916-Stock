[build]
  publish = "public"
  # public/·netlify.toml이 바뀌지 않은 커밋은 배포하지 않습니다(Netlify 크레딧 절약).
  # 비교할 이전 배포 정보가 없으면 항상 배포합니다. (exit 0 = 건너뜀, exit 1 = 배포)
  ignore = '[ -n "$CACHED_COMMIT_REF" ] && [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- public/ netlify.toml'

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
